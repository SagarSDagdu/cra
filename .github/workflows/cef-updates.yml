name: CEF updates

# Daily check for a newer stable CEF (Chromium) than the one Cra ships. When there
# is one, scripts/check-cef-update.sh opens an issue with the command that builds
# it on the Mac (scripts/update-cef.sh); the build itself does not run here.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Compare pinned CEF with the newest stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for a newer CEF
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-cef-update.sh
