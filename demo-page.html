<!doctype html><html><head><meta charset="utf-8"><title>Right edge</title><style>
body{margin:0;font:16px -apple-system,sans-serif;background:#fff;color:#111}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid #ddd}
nav a{margin-left:18px;color:#0a58ca;text-decoration:none;font-weight:600}
.logo{font-weight:800;font-size:20px}
.hero{text-align:center;padding:60px 20px 30px}
.hero h1{font-size:44px;margin:0}
.grid{display:flex;gap:20px;padding:0 24px}
.main{flex:1;background:#f3f4f6;height:300px;border-radius:10px}
.side{width:260px;background:#ffe08a;height:300px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.edge{position:fixed;right:0;top:120px;bottom:0;width:10px;background:#e11d48}
</style></head><body>
<header><span class="logo">Left logo</span><nav><a href="#">Docs</a><a href="#">Pricing</a><a href="#">Sign in</a></nav></header>
<div class="hero"><h1>Centred heading</h1></div>
<div class="grid"><div class="main"></div><div class="side">Right column</div></div>
<div class="edge"></div>
</body></html>
